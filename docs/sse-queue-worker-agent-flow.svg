<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760">
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New','Microsoft YaHei','SimHei',monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 0.03em; }
    .sub-h { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.06em; }
    .node { font-size: 13px; font-weight: 700; }
    .node-sub { font-size: 10.5px; fill: #94a3b8; }
    .edge { font-size: 10.5px; fill: #cbd5e1; }
    .legend { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
    <marker id="ar-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f97316"/></marker>
    <marker id="ar-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
    <marker id="ar-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10b981"/></marker>
  </defs>

  <rect width="960" height="760" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text class="title" x="480" y="34" text-anchor="middle">emsclaw 实时聊天链路:SSE / asyncio 队列 / worker / agent</text>

  <!-- section labels -->
  <text class="sub-h" x="200" y="70" text-anchor="middle">HTTP + SSE 边界(前端)</text>
  <text class="sub-h" x="700" y="70" text-anchor="middle">Agent 运行时 + 持久化(后端)</text>

  <!-- column divider -->
  <line x1="440" y1="84" x2="440" y2="680" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ============ ARROWS (drawn first) ============ -->

  <!-- 1. Frontend -> POST /chat -->
  <path d="M 200,138 L 200,168" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#ar-blue)"/>
  <text class="edge" x="210" y="158">① 发消息</text>

  <!-- 2. POST /chat -> background_worker (create_task) -->
  <path d="M 200,222 L 200,256" stroke="#f97316" stroke-width="1.8" fill="none" marker-end="url(#ar-orange)"/>
  <text class="edge" x="210" y="244">② create_task 启 worker</text>

  <!-- 3. worker -> runner (arun_agent_task_stream) -->
  <path d="M 320,290 L 380,290 L 380,404 L 460,404" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#ar-blue)"/>
  <text class="edge" x="336" y="282">③ arun_agent_task_stream</text>

  <!-- 4. runner -> worker (events back, astream_events v2) -->
  <path d="M 460,424 L 380,424 L 380,316 L 320,316" stroke="#a855f7" stroke-width="1.4" fill="none" marker-end="url(#ar-orange)"/>
  <text class="edge" x="336" y="336">④ 事件流(thinking/tool/approval)</text>

  <!-- 5. worker -> queue put_nowait -->
  <path d="M 200,348 L 200,378" stroke="#f97316" stroke-width="1.6" fill="none" marker-end="url(#ar-orange)"/>
  <text class="edge" x="208" y="368">emit_raw</text>

  <!-- 6. queue -> SSE generator (get) -->
  <path d="M 200,448 L 200,478" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#ar-gray)"/>
  <text class="edge" x="208" y="468">queue.get()</text>

  <!-- 7. SSE generator -> Frontend (event_source_response, left margin rail) -->
  <path d="M 60,494 L 30,494 L 30,120 L 60,120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#ar-gray)"/>
  <text class="edge" x="36" y="312">⑦ SSE 事件回流(可断线重连,按 event_id 游标回放)</text>

  <!-- 8. approval interrupt: runner -> PG (checkpointer write, durability=exit) -->
  <path d="M 620,460 L 620,508" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ar-green)"/>
  <text class="edge" x="628" y="488">checkpointer 写(durability=exit)</text>

  <!-- 9. resume: POST /approvals -> runner (read state) -->
  <path d="M 540,280 L 540,360" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#ar-green)"/>
  <text class="edge" x="548" y="324">⑨ Command(resume)</text>

  <!-- ============ NODES ============ -->

  <!-- Frontend ChatPage -->
  <g>
    <rect x="60" y="92" width="280" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="60" y="92" width="280" height="12" rx="6" fill="#3b82f6" opacity="0.35"/>
    <circle cx="70" cy="98" r="2" fill="#3b82f6"/><circle cx="78" cy="98" r="2" fill="#3b82f6"/><circle cx="86" cy="98" r="2" fill="#3b82f6"/>
    <text class="node" x="200" y="122" text-anchor="middle">Frontend · ChatPage</text>
  </g>

  <!-- POST /sessions/{id}/chat -->
  <g>
    <rect x="60" y="168" width="280" height="54" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
    <text class="node" x="200" y="192" text-anchor="middle">POST /sessions/{id}/chat</text>
    <text class="node-sub" x="200" y="208" text-anchor="middle">sessions.py:2699 · EventSourceResponse</text>
  </g>

  <!-- _agent_background_worker -->
  <g>
    <rect x="60" y="256" width="260" height="92" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.4"/>
    <text class="node" x="190" y="280" text-anchor="middle">_agent_background_worker</text>
    <text class="node-sub" x="190" y="296" text-anchor="middle">sessions.py:2322 · _WorkerCtx.emit_raw</text>
    <text class="node-sub" x="190" y="312" text-anchor="middle">消费 runner 事件 → _map_agent_stream</text>
    <text class="node-sub" x="190" y="328" text-anchor="middle">中途即时 save(approval/tool/step)</text>
    <text class="node-sub" x="190" y="343" text-anchor="middle">finally: done 事件 + put(None)</text>
  </g>

  <!-- asyncio.Queue (pipe shape) -->
  <g>
    <rect x="60" y="378" width="280" height="70" rx="35" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="68" y="386" width="40" height="54" rx="4" fill="#1e293b" stroke="none"/>
    <text class="node" x="200" y="406" text-anchor="middle">asyncio.Queue · _agent_queues</text>
    <text class="node-sub" x="200" y="422" text-anchor="middle">worker put_nowait ⇄ generator get</text>
    <text class="node-sub" x="200" y="436" text-anchor="middle">600s 超时 · 一个 worker 多次 SSE 重连</text>
  </g>

  <!-- event_generator SSE -->
  <g>
    <rect x="60" y="478" width="280" height="52" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
    <text class="node" x="200" y="502" text-anchor="middle">event_generator</text>
    <text class="node-sub" x="200" y="518" text-anchor="middle">sessions.py:2776 · yield SSE</text>
  </g>

  <!-- DeepAgent Runner (purple glow) -->
  <g filter="url(#glow-purple)">
    <rect x="460" y="360" width="320" height="100" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.6"/>
  </g>
  <g>
    <rect x="460" y="360" width="320" height="100" rx="6" fill="none" stroke="#a855f7" stroke-width="1.6"/>
    <text class="node" x="620" y="384" text-anchor="middle" fill="#e9d5ff">DeepAgent Runner</text>
    <text class="node-sub" x="620" y="402" text-anchor="middle" fill="#c4b5fd">runner.py · _arun_v2_stream</text>
    <text class="node-sub" x="620" y="418" text-anchor="middle" fill="#c4b5fd">astream_events v2 · thread_id</text>
    <text class="node-sub" x="620" y="434" text-anchor="middle" fill="#c4b5fd">thinking / tool_call / tool_result</text>
    <text class="node-sub" x="620" y="450" text-anchor="middle" fill="#c4b5fd">plan_update / approval_required</text>
  </g>

  <!-- Approval resume entry (small, top-right of runner) -->
  <g>
    <rect x="460" y="232" width="320" height="48" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text class="node" x="620" y="254" text-anchor="middle">POST /approvals/{interrupt_id}</text>
    <text class="node-sub" x="620" y="270" text-anchor="middle">sessions.py:1970 · resume → runner</text>
  </g>

  <!-- Postgres ai_agent (cylinder) -->
  <g>
    <ellipse cx="620" cy="512" rx="130" ry="11" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
    <rect x="490" y="512" width="260" height="80" fill="#052e16" stroke="none"/>
    <line x1="490" y1="512" x2="490" y2="592" stroke="#10b981" stroke-width="1.2"/>
    <line x1="750" y1="512" x2="750" y2="592" stroke="#10b981" stroke-width="1.2"/>
    <path d="M 490,592 A 130,11 0 0,0 750,592" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <text class="node" x="620" y="552" text-anchor="middle" fill="#a7f3d0">PostgreSQL · ai_agent</text>
    <text class="node-sub" x="620" y="570" text-anchor="middle" fill="#6ee7b7">Session(thread_id) · events JSONB</text>
    <text class="node-sub" x="620" y="584" text-anchor="middle" fill="#6ee7b7">checkpoints · ApprovalRecord</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(40,660)">
    <text class="legend" x="0" y="0" font-weight="700" fill="#e2e8f0">图例</text>
    <line x1="46" y1="-4" x2="76" y2="-4" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar-blue)"/>
    <text class="legend" x="82" y="0">请求/调用</text>
    <line x1="166" y1="-4" x2="196" y2="-4" stroke="#f97316" stroke-width="1.8" marker-end="url(#ar-orange)"/>
    <text class="legend" x="202" y="0">控制/触发</text>
    <line x1="286" y1="-4" x2="316" y2="-4" stroke="#a855f7" stroke-width="1.4" marker-end="url(#ar-orange)"/>
    <text class="legend" x="322" y="0">runner 事件流</text>
    <line x1="416" y1="-4" x2="446" y2="-4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ar-gray)"/>
    <text class="legend" x="452" y="0">SSE 回流</text>
    <line x1="536" y1="-4" x2="566" y2="-4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar-green)"/>
    <text class="legend" x="572" y="0">checkpointer 写</text>
    <line x1="686" y1="-4" x2="716" y2="-4" stroke="#10b981" stroke-width="1.5" marker-end="url(#ar-green)"/>
    <text class="legend" x="722" y="0">state 恢复</text>
  </g>
  <text class="node-sub" x="920" y="664" text-anchor="end">核心:worker 与 SSE 用 asyncio.Queue 解耦 · runner 经 checkpointer 持久化 interrupt</text>
  <text class="node-sub" x="920" y="680" text-anchor="end">后端重启后可按 thread_id 恢复 · 前端按 event_id 游标重连</text>
</svg>
