 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" font-family="Segoe UI, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ea580c"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker>
    <marker id="ae" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#059669"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="1180" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">HITL 审批流程：父子 Agent · interrupt · 决策回填</text>
  <text x="600" y="50" text-anchor="middle" font-size="12" fill="#64748b">子 Agent 声明 interrupt_on → LangGraph interrupt → Runner yield → 前端决策 → resume → tool_result 回填</text>
  <rect x="35" y="70" width="190" height="1030" fill="#faf5ff" opacity="0.25"/>
  <rect x="35" y="70" width="190" height="34" rx="4" fill="#7c3aed"/>
  <text x="130" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Lead Agent</text>
  <rect x="235" y="70" width="190" height="1030" fill="#eff6ff" opacity="0.25"/>
  <rect x="235" y="70" width="190" height="34" rx="4" fill="#2563eb"/>
  <text x="330" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">子 Agent</text>
  <rect x="505" y="70" width="190" height="1030" fill="#ecfdf5" opacity="0.25"/>
  <rect x="505" y="70" width="190" height="34" rx="4" fill="#059669"/>
  <text x="600" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Runner</text>
  <rect x="725" y="70" width="190" height="1030" fill="#fff7ed" opacity="0.25"/>
  <rect x="725" y="70" width="190" height="34" rx="4" fill="#ea580c"/>
  <text x="820" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Worker</text>
  <rect x="925" y="70" width="190" height="1030" fill="#f1f5f9" opacity="0.25"/>
  <rect x="925" y="70" width="190" height="34" rx="4" fill="#475569"/>
  <text x="1020" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">前端</text>
  <rect x="1095" y="70" width="90" height="1030" fill="#fef2f2" opacity="0.4"/>
  <rect x="1095" y="70" width="90" height="34" rx="4" fill="#dc2626"/>
  <text x="1140" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ApprovalRecord</text>
  <rect x="50" y="120" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="130" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1. create_deep_agent</text>
  <text x="130" y="151" text-anchor="middle" font-size="9.5" fill="#64748b">传 checkpointer</text>
  <line x1="130" y1="164" x2="330" y2="164" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ap)"/>
  <text x="230" y="158" text-anchor="middle" font-size="9.5" fill="#7c3aed">组装 SubAgent</text>
  <rect x="250" y="120" width="160" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="330" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2. get_interrupt_on()</text>
  <text x="330" y="151" text-anchor="middle" font-size="9.5" fill="#64748b">{tool: allowed_decisions}</text>
  <line x1="330" y1="164" x2="600" y2="164" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ag)"/>
  <text x="465" y="158" text-anchor="middle" font-size="9.5" fill="#64748b">interrupt_on 注册</text>
  <rect x="515" y="190" width="170" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3. tool 命中 interrupt</text>
  <text x="600" y="221" text-anchor="middle" font-size="9.5" fill="#64748b">LangGraph 抛 interrupt</text>
  <line x1="410" y1="190" x2="515" y2="190" stroke="#059669" stroke-width="1.8" marker-end="url(#ae)"/>
  <text x="470" y="184" text-anchor="middle" font-size="9.5" fill="#059669">运行时触发</text>
  <rect x="512" y="254" width="175" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">4. aget_state()</text>
  <text x="600" y="285" text-anchor="middle" font-size="9.5" fill="#64748b">收集 interrupts + 反查 attribution</text>
  <line x1="600" y1="234" x2="600" y2="248" stroke="#059669" stroke-width="1.8" marker-end="url(#ae)"/>
  <path d="M 600,282 L 675,312 L 600,342 L 525,312 z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="600" y="315" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">auto_approve?</text>
  <line x1="600" y1="282" x2="600" y2="292" stroke="#059669" stroke-width="1.8" marker-end="url(#ae)"/>
  <rect x="507" y="362" width="185" height="48" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="379" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6a. yield approval_required</text>
  <text x="600" y="393" text-anchor="middle" font-size="9.5" fill="#64748b">action_requests / review_configs</text>
  <line x1="540" y1="312" x2="540" y2="362" stroke="#059669" stroke-width="1.8" marker-end="url(#ae)"/>
  <text x="510" y="337" text-anchor="middle" font-size="9.5" fill="#059669">否(手动)</text>
  <rect x="732" y="424" width="175" height="48" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
  <text x="820" y="441" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">7a. 落库 pending</text>
  <text x="820" y="455" text-anchor="middle" font-size="9.5" fill="#64748b">status=AWAITING_APPROVAL</text>
  <line x1="692" y1="386" x2="732" y2="448" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="710" y="380" text-anchor="middle" font-size="9.5" fill="#ea580c">事件入队</text>
  <rect x="940" y="424" width="160" height="48" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="1020" y="441" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">8a. ApprovalCard</text>
  <text x="1020" y="455" text-anchor="middle" font-size="9.5" fill="#64748b">渲染待决策卡片</text>
  <line x1="907" y1="448" x2="942" y2="448" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="924" y="440" text-anchor="middle" font-size="9.5" fill="#2563eb">SSE</text>
  <rect x="1100" y="424" width="80" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="1140" y="441" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">9a. INSERT</text>
  <text x="1140" y="455" text-anchor="middle" font-size="9.5" fill="#64748b">pending</text>
  <polyline points="820,472 820,482 1140,482 1140,472" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ar)"/>
  <text x="980" y="476" text-anchor="middle" font-size="9.5" fill="#dc2626">create_pending</text>
  <rect x="872" y="312" width="175" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="960" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6b. yield approval_decided</text>
  <text x="960" y="343" text-anchor="middle" font-size="9.5" fill="#64748b">auto=True, decision=approve</text>
  <line x1="675" y1="312" x2="872" y2="312" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="770" y="306" text-anchor="middle" font-size="9.5" fill="#7c3aed">是(auto)</text>
  <rect x="1100" y="312" width="80" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="1140" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">7b. UPDATE</text>
  <text x="1140" y="343" text-anchor="middle" font-size="9.5" fill="#64748b">auto_approved</text>
  <line x1="1047" y1="312" x2="1100" y2="312" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ar)"/>
  <rect x="500" y="494" width="200" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="600" y="511" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">10. resume worker</text>
  <text x="600" y="525" text-anchor="middle" font-size="9.5" fill="#64748b">Command(resume={iid:decisions})</text>
  <polyline points="1020,472 1020,488" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="1030" y="464" text-anchor="middle" font-size="9.5" fill="#2563eb">POST /approvals/{iid}</text>
  <polyline points="960,336 960,512 700,518" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ap)"/>
  <text x="830" y="506" text-anchor="middle" font-size="9.5" fill="#7c3aed">内联续流(不重启)</text>
  <rect x="515" y="564" width="170" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="581" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">11. 工具执行</text>
  <text x="600" y="595" text-anchor="middle" font-size="9.5" fill="#64748b">被审批的工具运行</text>
  <line x1="600" y1="542" x2="600" y2="558" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <rect x="512" y="622" width="175" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="639" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">12. yield tool(called)</text>
  <text x="600" y="653" text-anchor="middle" font-size="9.5" fill="#64748b">tool_result 内容</text>
  <line x1="600" y1="608" x2="600" y2="616" stroke="#059669" stroke-width="1.8" marker-end="url(#ae)"/>
  <rect x="732" y="680" width="175" height="48" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
  <text x="820" y="697" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">13. attach_tool_result</text>
  <text x="820" y="711" text-anchor="middle" font-size="9.5" fill="#64748b">_handle_approval_and_tool</text>
  <line x1="692" y1="644" x2="732" y2="704" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/>
  <rect x="1100" y="680" width="80" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="1140" y="697" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">14. UPDATE</text>
  <text x="1140" y="711" text-anchor="middle" font-size="9.5" fill="#64748b">tool_result / decided</text>
  <polyline points="910,704 1100,704" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ar)"/>
  <text x="1010" y="696" text-anchor="middle" font-size="9.5" fill="#dc2626">回填出参</text>
  <rect x="500" y="746" width="200" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="600" y="763" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">15. status=COMPLETED</text>
  <text x="600" y="777" text-anchor="middle" font-size="9.5" fill="#64748b">emit done + 哨兵 None</text>
  <polyline points="1140,728 1140,768 700,768" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#ag)"/>
  <text x="900" y="760" text-anchor="middle" font-size="9.5" fill="#64748b">收尾</text>
  <rect x="45" y="1110" width="1140" height="50" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="60" y="1130" font-size="11" font-weight="700" fill="#0f172a">图例</text>
  <line x1="100" y1="1140" x2="132" y2="1140" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/><text x="140" y="1144" font-size="11" fill="#334155">Lead/子Agent 声明</text>
  <line x1="290" y1="1140" x2="322" y2="1140" stroke="#059669" stroke-width="2" marker-end="url(#ae)"/><text x="330" y="1144" font-size="11" fill="#334155">Runner 事件</text>
  <line x1="450" y1="1140" x2="482" y2="1140" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/><text x="490" y="1144" font-size="11" fill="#334155">Worker 落库/推流</text>
  <line x1="640" y1="1140" x2="672" y2="1140" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="680" y="1144" font-size="11" fill="#334155">SSE/resume 流</text>
  <line x1="810" y1="1140" x2="842" y2="1140" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="850" y="1144" font-size="11" fill="#334155">DB 写入/回填</text>
  <line x1="990" y1="1140" x2="1022" y2="1140" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#ag)"/><text x="1030" y="1144" font-size="11" fill="#334155">控制/收尾</text>
</svg>