[project]
name = "emsclaw-sandbox"
version = "0.0.0"
description = "emsclaw sandbox: tool execution + PDF/XLSX/PPTX/data-analysis skills"
requires-python = ">=3.12"
dependencies = [
    # ── @tool 运行依赖 + docx skill XML 处理 ───────────────────────────────
    "langchain-core",
    "pydantic",
    "httpx",
    "pyyaml",
    "defusedxml",

    # ── PDF/XLSX/PPTX skill + data analysis 依赖 ───────────────────────────
    "fpdf2>=2.8.5",
    "fonttools",
    "pypdf",
    "pdfplumber",
    "Pillow",
    "pdf2image",
    "PyMuPDF",
    "matplotlib",
    "numpy",
    "reportlab",
    "pandas",
    "seaborn",
    "openpyxl",
    "markitdown[pptx]",
]

# 源码直接运行，不构建为发行包
[tool.uv]
package = false
