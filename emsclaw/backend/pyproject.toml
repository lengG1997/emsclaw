[project]
name = "emsclaw-backend"
version = "0.0.0"
description = "emsclaw backend service (FastAPI + LangGraph + DeepAgents 0.6.x)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.7",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "sse-starlette==3.2.0",
    "loguru==0.7.3",
    "python-json-logger==4.0.0",
    "bcrypt==5.0.0",
    "shortuuid==1.0.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary]",
    "psycopg-pool==3.3.1",
    "langchain>=1.3.0,<1.4.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.8",
    "langchain-google-genai",
    "langgraph==1.2.9",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "httpx==0.28.1",
    "tavily-python==0.7.21",
    "pyyaml>=6.0",
    "deepagents>=0.6.0,<0.7.0",
    "langchain-mcp-adapters",
    "langfuse>=4.14,<5.0",    # Langfuse 可观测性（LangChain CallbackHandler，OTel 上报）
    "lark-oapi",
    "qrcode>=8.0",
    "scipy>=1.13",         # scipy.optimize.linprog(method="highs") — dispatch_planning 多目标 LP
]

# 源码直接运行（Docker 里用 PYTHONPATH，本地开发也跑源码），不构建为发行包
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
